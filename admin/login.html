<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoWarm Admin · Sign In</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/admin.css">
    <link rel="stylesheet" href="assets/css/login.css">
</head>
<body class="login-body">
    <!-- Animated Background -->
    <div class="login-bg">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
        <div class="grid-overlay"></div>
    </div>

    <!-- Floating Theme Toggle -->
    <button class="theme-toggle floating-toggle" id="themeToggle" aria-label="Toggle Theme">
        <i class="fas fa-sun sun-icon"></i>
        <i class="fas fa-moon moon-icon"></i>
        <span class="toggle-thumb"></span>
    </button>

    <a href="../index.html" class="back-to-store">
        <i class="fas fa-arrow-left"></i>
        <span>Back to Store</span>
    </a>

    <main class="login-wrap">
        <div class="login-card">
            <div class="login-card-glow"></div>

            <div class="login-brand">
                <div class="logo-mark"><i class="fas fa-leaf"></i></div>
                <h1>EcoWarm <em>Admin</em></h1>
                <p>Sign in to manage your premium pet store</p>
            </div>

            <form class="login-form" id="loginForm">
                <div class="form-field">
                    <label>
                        <i class="fas fa-user"></i>
                        <span>Username</span>
                    </label>
                    <input type="text" id="username" placeholder="admin" required autocomplete="username">
                </div>

                <div class="form-field">
                    <label>
                        <i class="fas fa-lock"></i>
                        <span>Password</span>
                    </label>
                    <div class="pwd-wrap">
                        <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
                        <button type="button" class="pwd-toggle" id="pwdToggle" aria-label="Toggle password">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="form-meta">
                    <label class="check-row">
                        <input type="checkbox" id="remember">
                        <span class="check-box"></span>
                        Remember me
                    </label>
                    <a href="#" class="forgot">Forgot password?</a>
                </div>

                <button type="submit" class="login-btn">
                    <span class="btn-text">Sign In</span>
                    <span class="btn-loader"></span>
                    <i class="fas fa-arrow-right"></i>
                </button>

                <div class="divider"><span>Demo Credentials</span></div>

                <div class="demo-card">
                    <i class="fas fa-info-circle"></i>
                    <div>
                        <strong>admin</strong> / <strong>admin123</strong>
                        <span>Click to autofill</span>
                    </div>
                </div>
            </form>

            <p class="login-foot">© 2025 EcoWarm. Crafted by <strong>Aditya Kumar Sah</strong></p>
        </div>
    </main>

    <script src="assets/js/login.js"></script>
</body>
</html>
